spring.application.name=mudbase-showcase-docs-search-java
server.port=${PORT:8080}

# --- Mudbase project wiring ---------------------------------------------------
mudbase.base-url=${MUDBASE_URL:https://cloud.mudbase.dev}
mudbase.project-id=${MUDBASE_PROJECT_ID:}
mudbase.documents-collection-id=${MUDBASE_DOCUMENTS_COLLECTION_ID:}
mudbase.search-log-collection-id=${MUDBASE_SEARCH_LOG_COLLECTION_ID:}
# The deployed docsAskRetrieval Function and its org-scoped ak_ API key - see
# plan/build-plan.md "Ask AI architecture" for why this needs a separate key from the project's
# own pk_ key. Never committed with a real value - see .env.example.
mudbase.function-id=${MUDBASE_FUNCTION_ID:}
mudbase.functions-api-key=${MUDBASE_FUNCTIONS_API_KEY:}

# --- LLM (Anthropic Claude) --------------------------------------------------
# Server-only. Deliberately allowed to be blank at startup - see LlmProperties javadoc. The Ask
# AI feature fails with a clear "ANTHROPIC_API_KEY is not configured" error rather than a silent
# or fabricated success when this is unset.
llm.api-key=${ANTHROPIC_API_KEY:}
llm.model=${LLM_MODEL:claude-opus-5}

# --- Thymeleaf ------------------------------------------------------------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# --- Sessions ---------------------------------------------------------------
server.servlet.session.timeout=30m

logging.level.dev.mudbase.showcase.docssearch=INFO
