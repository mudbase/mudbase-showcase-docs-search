{{define "content"}}
<div style="max-width:24rem;margin:0 auto">
  <div class="center" style="margin-bottom:1.5rem">
    <h1>Create your account</h1>
    <p class="muted">Sign in to add and edit documents in the knowledge base.</p>
  </div>
  <form method="post" action="/register" class="stacked">
    <div class="field-row">
      <div class="field">
        <label for="firstName">First name</label>
        <input id="firstName" name="firstName" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="lastName">Last name</label>
        <input id="lastName" name="lastName" autocomplete="family-name" required>
      </div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
    </div>
    <label class="checkbox-field">
      <input type="checkbox" name="agreedToTerms">
      I agree to the Terms of Service and Privacy Policy.
    </label>
    <button type="submit" class="button">Create account</button>
  </form>
  <p class="muted center" style="margin-top:1rem">Already have an account? <a href="/login">Sign in</a></p>
</div>
{{end}}
